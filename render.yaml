# Render Blueprint: New > Blueprint > pick this repo. Secrets are entered in the Render dashboard, never committed.
services:
  - type: web
    name: drift
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn orggraph.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DRIFT_LLM_PER_DAY
        value: "300"
